[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orbexa"
version = "2.3.0"
description = "Orbital Rendezvous and Capture Experiment with Adaptive Tube MPC"
authors = [
  { name = "Aaron John Sabu", email = "aaronjs@g.ucla.edu" },
  { name = "Brett T. Lopez", email = "btlopez@ucla.edu" },
]
license = { text = "GPL-2.0-only" }
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
  "numpy",
  "scipy",
  "gekko",
  "matplotlib",
  "plotly",
  "pyyaml",
  "keyboard",
]

[project.optional-dependencies]
casadi = ["casadi"]
visualization = ["mayavi"]
video = ["imageio-ffmpeg"]
studio = ["mistune>=3,<4"]
certification = ["python-flint>=0.8,<0.10", "zstandard==0.25.0"]
all = ["casadi", "mayavi", "imageio-ffmpeg", "mistune>=3,<4", "python-flint>=0.8,<0.10", "zstandard==0.25.0"]

[tool.setuptools]
package-dir = {orbexa = "scripts"}
packages = [
  "orbexa", "orbexa.cli", "orbexa.control", "orbexa.core",
  "orbexa.estimation", "orbexa.planning", "orbexa.simulation",
  "orbexa.solvers", "orbexa.utils", "orbexa.visualization",
]

[tool.setuptools.package-data]
"orbexa.visualization" = ["studio/*", "studio/vendor/*", "studio/vendor/three/*", "studio/vendor/katex/*", "studio/vendor/katex/fonts/*"]

[project.scripts]
orbexa-generate-demo = "orbexa.cli.generate_demo:main"
orbexa-complete-mission = "orbexa.cli.complete_mission:main"
orbexa-run-mission = "orbexa.cli.run_mission:main"
orbexa-serve-studio = "orbexa.cli.serve_studio:main"
orbexa-run-nonlinear = "orbexa.cli.run_nonlinear:main"


[project.urls]
Homepage = "https://github.com/aaronjs99/orbex-a"
Documentation = "https://github.com/aaronjs99/orbex-a#readme"
